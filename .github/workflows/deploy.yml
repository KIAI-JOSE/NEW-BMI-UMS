name: Deploy to GitHub Pages

on:
  push:
    branches: [ MAIN-BMI, kiro-dev ]
  pull_request:
    branches: [ MAIN-BMI ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      env:
        NODE_ENV: production
        VITE_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/MAIN-BMI' || github.ref == 'refs/heads/kiro-dev'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: false